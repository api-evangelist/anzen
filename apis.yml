name: Anzen
description: >-
  Anzen Technologies builds AI-powered market access software for commercial
  insurance agencies. Its flagship product, Anzen Pro, automates the commercial
  insurance quoting workflow: intelligent market matching predicts which
  carriers are most likely to respond to a submission based on historical
  quoting data, automated submission routing delivers each submission to a
  carrier's preferred channel (email, portal, or form), and submission intake
  extracts data from ACORDs, emails, and PDFs to generate branded client
  proposals in seconds. Anzen reports recovering roughly 80% of the time agency
  teams spend on administrative tasks and serves 200+ agencies while reducing
  errors-and-omissions exposure. The company holds a SOC 2 Type II attestation
  and anchors its security program on the NIST Cybersecurity Framework. Backed
  by a16z. No public developer API, documentation, or SDKs are published as of
  this enrichment pass.
